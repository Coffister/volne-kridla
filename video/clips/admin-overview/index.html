<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>06 — Administrácia dopytov</title>
    <script src="shared/gsap.min.js"></script>
    <script src="shared/stage.js"></script>
    <script src="assets/admin-overview/meta.js"></script>
    <link rel="stylesheet" href="shared/stage.css" />
  </head>
  <body>
    <div id="root" data-composition-id="admin-overview" data-start="0" data-width="1920" data-height="1080" data-duration="8">
      <div id="cam">
        <img class="layer" id="overview" src="assets/admin-overview/overview.png" alt="" />
        <img class="layer hidden step" id="hover" src="assets/admin-overview/overview-hover.png" alt="" />
        <img class="layer hidden step" id="dopyty" src="assets/admin-overview/dopyty.png" alt="" />
        <video class="layer clip" id="scroll" src="assets/admin-overview/scroll.mp4" muted playsinline data-start="2.3" data-duration="1.4"></video>
        <img class="layer hidden step" id="end" src="assets/admin-overview/scroll-end.png" alt="" />
        <div id="cursor">
          <!-- the admin has no custom cursor: plain system arrow -->
          <svg class="shape" width="18" height="26" viewBox="0 0 18 26" aria-hidden="true">
            <path d="M1 1 L1 20 L5.6 15.8 L8.8 23.4 L12 22 L8.9 14.6 L15 14.6 Z" fill="#0c0c0c" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
    </div>
    <script>
      const M = window.META;
      const st = Stage();
      const rest = { x: 900, y: 600 };
      const card = st.center(M.card);
      const rec = st.center(M.record);

      st.cursorAt(rest);
      // overview → "Dopyty" quick action (real hover state, then the list)
      st.move(0.2, 1.0, card);
      st.show(1.1, "#hover", 0.15);
      st.click(1.45);
      st.show(1.55, "#dopyty", 0.3);
      st.move(1.7, 0.8, { x: 1000, y: 700 }, "power1.inOut");
      // 2.3–3.7 real scroll of the admin column down to the consultations
      st.cut(3.7, "#end");
      // read one inquiry: track · type · package, contact, parrot, topic, note
      st.cam(3.8, 1.6, { x: rec.x + 10, y: rec.y, z: 1.42 });
      st.move(3.9, 1.2, { x: M.record.x + M.record.w - 60, y: M.record.y + M.record.h - 36 });
      // 7.3–8.0 back to the overview for the loop
      st.tl.set("#hover, #dopyty", { opacity: 0 }, 7.3);
      st.hide(7.3, "#end", 0.7);
      st.cam(7.3, 0.7, { z: 1 });
      st.move(7.3, 0.7, rest);
      window.__timelines["admin-overview"] = st.tl;
    </script>
  </body>
</html>
