<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>01 — Homepage</title>
    <script src="shared/gsap.min.js"></script>
    <script src="shared/stage.js"></script>
    <script src="assets/homepage/meta.js"></script>
    <link rel="stylesheet" href="shared/stage.css" />
  </head>
  <body>
    <div id="root" data-composition-id="homepage" data-start="0" data-width="1920" data-height="1080" data-duration="7">
      <div id="cam">
        <img class="layer" id="top" src="assets/homepage/top.png" alt="" />
        <video class="layer clip" id="scroll" src="assets/homepage/scroll.mp4" muted playsinline data-start="3" data-duration="2.6"></video>
        <img class="layer hidden" id="end" src="assets/homepage/scroll-end.png" alt="" />
      </div>
    </div>
    <script>
      const { headline } = window.META;
      const st = Stage();
      const h = st.center(headline);

      // 0.0–1.0 hero as-is · 0.8–2.8 push in on the headline
      st.cam(0.8, 2.0, { x: h.x + 40, y: h.y - 30, z: 1.32 });
      // 3.0–5.6 real scroll down to "O Voľných krídlach", camera eases back out
      st.cam(3.0, 1.8, { z: 1 });
      st.cut(5.6, "#end");
      // 6.4–7.0 settle back to the opening frame for a seamless loop
      st.hide(6.4, "#end", 0.6);
      window.__timelines["homepage"] = st.tl;
    </script>
  </body>
</html>
