<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>03 — Viackrokový formulár</title>
    <script src="shared/gsap.min.js"></script>
    <script src="shared/stage.js"></script>
    <script src="assets/inquiry-form/meta.js"></script>
    <link rel="stylesheet" href="shared/stage.css" />
  </head>
  <body>
    <div id="root" data-composition-id="inquiry-form" data-start="0" data-width="1920" data-height="1080" data-duration="8">
      <div id="cam">
        <img class="layer" id="s0" src="assets/inquiry-form/s0.png" alt="" />
        <img class="layer hidden step" id="s1" src="assets/inquiry-form/s1.png" alt="" />
        <img class="layer hidden step" id="s2" src="assets/inquiry-form/s2.png" alt="" />
        <img class="layer hidden step" id="s3" src="assets/inquiry-form/s3.png" alt="" />
        <img class="layer hidden step" id="s4" src="assets/inquiry-form/s4-focus.png" alt="" />
        <img class="layer hidden step" id="t1" src="assets/inquiry-form/s4-type1.png" alt="" />
        <img class="layer hidden step" id="t2" src="assets/inquiry-form/s4-type2.png" alt="" />
        <img class="layer hidden step" id="t3" src="assets/inquiry-form/s4-type3.png" alt="" />
        <img class="layer hidden step" id="t4" src="assets/inquiry-form/s4-type4.png" alt="" />
        <div id="cursor">
          <div class="shape">
            <img class="default" src="shared/cursor/default.png" alt="" />
            <img class="pointer" src="shared/cursor/pointer.png" alt="" />
          </div>
        </div>
      </div>
    </div>
    <script>
      const M = window.META;
      const st = Stage();
      const rest = { x: 1010, y: 640 };
      const track = st.center(M.track);
      const pkg = { x: M.pkg.x + M.pkg.w / 2, y: M.pkg.y + 150 };
      const next = st.center(M.next);
      const field = st.center(M.nameInput);

      st.cursorAt(rest);
      // step 1 — pick the consultation track, the type and packages unfold
      st.move(0.2, 0.8, track);
      st.pointer(0.9, true);
      st.click(1.05);
      st.show(1.15, "#s1", 0.18);
      // choose the package
      st.move(1.6, 0.8, pkg);
      st.click(2.45);
      st.show(2.55, "#s2", 0.2);
      // continue to step 2 (stepper advances)
      st.move(2.8, 0.7, next);
      st.click(3.55);
      st.show(3.65, "#s3", 0.3);
      st.cam(3.7, 0.9, { x: 720, y: 405, z: 1.2 });
      // fill the parrot's name
      st.move(3.95, 0.65, field);
      st.click(4.65);
      st.cut(4.72, "#s4");
      st.move(4.85, 0.5, { x: field.x + 90, y: field.y + 60 }, "power1.out");
      ["#t1", "#t2", "#t3", "#t4"].forEach((sel, i) => st.cut(5.0 + i * 0.18, sel));
      st.cam(5.6, 0.9, { x: 640, y: 380, z: 1.45 });
      // 7.3–8.0 back to the opening state for the loop
      st.tl.set(".step:not(#t4)", { opacity: 0 }, 7.3);
      st.hide(7.3, "#t4", 0.7);
      st.cam(7.3, 0.7, { z: 1 });
      st.move(7.3, 0.7, rest);
      st.pointer(7.5, false);
      window.__timelines["inquiry-form"] = st.tl;
    </script>
  </body>
</html>
