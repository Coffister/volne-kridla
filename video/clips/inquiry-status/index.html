<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>07 — Spracovanie dopytu</title>
    <script src="shared/gsap.min.js"></script>
    <script src="shared/stage.js"></script>
    <script src="assets/inquiry-status/meta.js"></script>
    <link rel="stylesheet" href="shared/stage.css" />
  </head>
  <body>
    <div id="root" data-composition-id="inquiry-status" data-start="0" data-width="1920" data-height="1080" data-duration="7">
      <div id="cam">
        <img class="layer" id="open" src="assets/inquiry-status/open.png" alt="" />
        <img class="layer hidden step" id="handled" src="assets/inquiry-status/handled.png" alt="" />
        <img class="layer hidden step" id="reopened" src="assets/inquiry-status/reopened.png" alt="" />
        <div id="cursor">
          <!-- the admin has no custom cursor: plain system arrow -->
          <svg class="shape" width="18" height="26" viewBox="0 0 18 26" aria-hidden="true">
            <path d="M1 1 L1 20 L5.6 15.8 L8.8 23.4 L12 22 L8.9 14.6 L15 14.6 Z" fill="#0c0c0c" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
    </div>
    <script>
      const M = window.META;
      // the "Konzultácie · N nevybavených" header and the record in one frame
      const base = { x: 560, y: 285, z: 1.4 };
      const st = Stage(base);
      const rest = { x: 700, y: 520 };
      const btn = st.center(M.button);
      const back = st.center(M.buttonBack);

      st.cursorAt(rest);
      // mark the inquiry as handled: card dims, button flips, count drops
      st.move(0.3, 0.9, btn);
      st.click(1.3);
      st.show(1.4, "#handled", 0.2);
      st.move(1.7, 0.6, { x: 540, y: 480 });
      st.cam(1.8, 1.4, { x: 520, y: 270, z: 1.55 });
      // and back to unhandled — the same real toggle, which closes the loop
      st.cam(4.2, 0.7, base);
      st.move(4.2, 0.7, back);
      st.click(5.0);
      st.show(5.1, "#reopened", 0.2);
      st.move(5.4, 0.8, rest);
      window.__timelines["inquiry-status"] = st.tl;
    </script>
  </body>
</html>
