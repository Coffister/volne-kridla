<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <!-- Supabase invite / password-reset links land on the Site URL (the home
         page) with the session in the hash. Send them to the set-password
         page *before* the app loads — the Supabase client reads and strips
         that hash the moment it starts. Expired links (error_code=…) go
         there too, so the visitor gets an explanation. -->
    <script>
      (function () {
        var h = location.hash;
        // kept for the set-password page: the Supabase client clears the
        // hash before the (lazy-loaded) admin gets to read it
        window.__vkAuthHash = h;
        if (
          /(?:^#|&)(type=(invite|recovery)|error_code=)/.test(h) &&
          location.pathname !== "/admin/heslo"
        ) {
          location.replace("/admin/heslo" + h);
        }
      })();
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default/fallback tags for a crawler that doesn't run the app's JS —
         each route overwrites these at runtime via useDocumentMeta. -->
    <title>Voľné krídla — výcvik voľného lietania papagájov</title>
    <meta
      name="description"
      content="Voľné krídla — bezpečný výcvik voľného lietania papagájov, konzultácie a kurzy s Frankou. Naučte svojho papagája lietať vonku a vrátiť sa späť k vám."
    />
    <link rel="canonical" href="https://volnekridla.sk/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Voľné krídla" />
    <meta property="og:title" content="Voľné krídla — výcvik voľného lietania papagájov" />
    <meta
      property="og:description"
      content="Bezpečný výcvik voľného lietania papagájov, konzultácie a kurzy s Frankou."
    />
    <meta property="og:url" content="https://volnekridla.sk/" />
    <meta property="og:image" content="https://volnekridla.sk/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Voľné krídla — výcvik voľného lietania papagájov" />
    <meta
      name="twitter:description"
      content="Bezpečný výcvik voľného lietania papagájov, konzultácie a kurzy s Frankou."
    />
    <meta name="twitter:image" content="https://volnekridla.sk/og-image.jpg" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
